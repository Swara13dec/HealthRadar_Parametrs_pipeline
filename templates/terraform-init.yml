steps:
  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      backendServiceArm: 'testHealthService'
      backendAzureRmStorageAccountName: 'stgforhealth'
      backendAzureRmContainerName: 'healthcnt'
      backendAzureRmKey: 'health.tfstate'
      workingDirectory: '$(System.DefaultWorkingDirectory)/environment/${{ parameters.testparameters }}'
      commandOptions: '-reconfigure'
